[project]
name = "ai-engineering-bootcamp-prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=6.1.0",
    "fastembed>=0.8.0",
    "google-genai>=1.57.0",
    "groq>=1.0.0",
    "ipykernel>=7.1.0",
    "langsmith>=0.8.4",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
]

[tool.uv.workspace]
members = ["apps/api", "apps/chatbot_ui"]

[dependency-groups]
dev = [
    "langgraph>=1.2.0",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.18",
    "langgraph-checkpoint-postgres>=2.0.0",
]
